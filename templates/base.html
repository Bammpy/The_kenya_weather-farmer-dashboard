<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bammpy ByteBeam Forge - Python Dev & Fiber Tech{% endblock %}</title>
    <meta name="description" content="Bammpy - Python full-stack developer, ML enthusiast, fiber optic technician. Custom projects for sale · Web/mobile/desktop apps · High-speed WiFi & fiber installation.">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Google Fonts - Futuristic feel -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" style="font-family: 'Orbitron', sans-serif; letter-spacing: 2px;">
                Bammpy ByteBeam Forge
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="/services">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="/portfolio">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/fiber-tech">Fiber Tech</a></li>
                    <li class="nav-item"><a class="nav-link" href="/blog">Blog</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                    <li class="nav-item ms-3">
                        <button id="themeToggle" class="btn btn-outline-light btn-sm">🌙</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Block -->
    <main class="pt-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light py-5 mt-5">
        <div class="container">
            <div class="row justify-content-center">
                <!-- Social Icons -->
                <div class="col-md-4 text-center mb-4">
                    <h5 class="gradient-text mb-3">Connect With Me</h5>
                    <div class="d-flex justify-content-center gap-4">
                        <a href="https://www.linkedin.com/in/brightone-aoko-1923603a8" target="_blank" class="text-light fs-3" title="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="https://www.instagram.com/bammpybytebeamforge/" target="_blank" class="text-light fs-3" title="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://chat.whatsapp.com/LHbP4Jp8NC92LvYzUhG3I1" target="_blank" class="text-light fs-3" title="WhatsApp Group">
                            <i class="fab fa-whatsapp"></i>
                        </a>
                        <a href="https://t.me/@yedeal" target="_blank" class="text-light fs-3" title="Telegram">
                            <i class="fab fa-telegram-plane"></i>
                        </a>
                    </div>
                </div>
            </div>
            <p class="text-center mt-4">&copy; 2025 Bammpy ByteBeam Forge. Forging the future of code and connectivity.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ once: true });</script>
    
    <!-- Custom JS (Dark Mode Toggle) -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
